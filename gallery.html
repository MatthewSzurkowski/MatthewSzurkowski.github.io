```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <title>mszurkow's Photo Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #141414;
      --surface: #242424;
      --line: #2c2c2c;
      --text: #f4f4f4;
      --muted: #9a9a9a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      border: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* Top bar and back button */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px 9px 10px;
      background: var(--surface);
      border-radius: 10px;
      color: #e8e8e8;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back:hover {
      background: #333;
      transform: translateX(-2px);
    }

    .back svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Main content */
    main {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 28px 64px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    /* Responsive image grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .photo {
      display: block;
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: var(--radius);
      background: #242424;
      padding: 0;
      cursor: zoom-in;
      isolation: isolate;
    }

    /* Shimmer placeholder while the image loads */
    .photo::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        110deg,
        #242424 8%,
        #353535 18%,
        #242424 33%
      );
      background-size: 200% 100%;
      animation: photo-shimmer 1.5s linear infinite;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .photo.is-loaded::before {
      opacity: 0;
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
    }

    .photo.is-loaded img {
      opacity: 1;
    }

    .photo:hover img {
      transform: scale(1.04);
    }

    @keyframes photo-shimmer {
      to {
        background-position-x: -200%;
      }
    }

    /* Message shown when the gallery cannot load */
    .empty {
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: #ccc;
      line-height: 1.8;
    }

    .empty code {
      color: white;
      background: #383838;
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* Full-size image viewer */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.94);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .close {
      position: absolute;
      top: 18px;
      right: 20px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #292929;
      font-size: 26px;
    }

    .close:hover {
      background: #414141;
    }

    .caption {
      position: absolute;
      bottom: 18px;
      left: 16px;
      right: 16px;
      text-align: center;
      color: #ccc;
      font-size: 13px;
    }

    footer {
      padding: 0 20px 32px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1000px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      main {
        padding-inline: 22px;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 14px;
      }

      main {
        padding: 24px 14px 44px;
      }

      .heading {
        margin-bottom: 18px;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .photo {
        border-radius: 10px;
      }

      .lightbox {
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .photo::before {
        animation: none;
      }

      .photo,
      .photo::before,
      .photo img,
      .back {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back to home page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back</span>
    </a>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>Gallery</h1>
        <p class="subtitle">A collection of photos.</p>
      </div>
      <span class="count" id="count"></span>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="empty" id="empty" hidden>
      No photos found. Add image paths to
      <code>assets/images/gallery/images.json</code>.
    </div>
  </main>

  <footer>© <span id="year"></span> Matthew Szurkowski</footer>

  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="close" id="close" aria-label="Close image">×</button>
    <img id="large-image" alt="">
    <div class="caption" id="caption"></div>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("large-image");
    const caption = document.getElementById("caption");
    const closeButton = document.getElementById("close");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showPhoto(src, name) {
      largeImage.src = "";
      largeImage.alt = name;
      caption.textContent = name;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      closeButton.focus();

      largeImage.src = src;
    }

    function closePhoto() {
      lightbox.classList.remove("open");
      largeImage.src = "";
      document.body.style.overflow = "";
    }

    closeButton.addEventListener("click", closePhoto);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closePhoto();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && lightbox.classList.contains("open")) {
        closePhoto();
      }
    });

    function updateCount() {
      const total = gallery.children.length;
      count.textContent = `${total} ${total === 1 ? "photo" : "photos"}`;
    }

    async function loadGallery() {
      try {
        const response = await fetch("assets/images/gallery/images.json");

        if (!response.ok) {
          throw new Error("Could not load image list");
        }

        const images = await response.json();

        if (!Array.isArray(images) || images.length === 0) {
          empty.hidden = false;
          count.textContent = "0 photos";
          return;
        }

        images.forEach((item, index) => {
          const src = typeof item === "string" ? item : item.src;

          if (typeof src !== "string" || !src.trim()) {
            return;
          }

          const filename = src.split("/").pop();
          const name = typeof item === "string"
            ? filename
                .replace(/\.[^.]+$/, "")
                .replace(/[-_]+/g, " ")
            : (item.alt || `Photo ${index + 1}`);

          const button = document.createElement("button");
          button.className = "photo";
          button.type = "button";
          button.setAttribute("aria-label", `View ${name}`);

          const img = document.createElement("img");
          img.alt = name;
          img.loading = "lazy";
          img.decoding = "async";

          // Reveal each image when it has loaded successfully.
          img.addEventListener("load", () => {
            button.classList.add("is-loaded");
          });

          // Remove broken images from the gallery.
          img.addEventListener("error", () => {
            button.remove();
            updateCount();

            if (gallery.children.length === 0) {
              empty.hidden = false;
            }
          });

          button.appendChild(img);

          button.addEventListener("click", () => {
            showPhoto(src, name);
          });

          gallery.appendChild(button);

          // Set src after listeners are attached.
          img.src = src;

          // Handle images that loaded from cache immediately.
          if (img.complete && img.naturalWidth > 0) {
            button.classList.add("is-loaded");
          }
        });

        updateCount();

        if (gallery.children.length === 0) {
          empty.hidden = false;
        }
      } catch (error) {
        console.error("Unable to load gallery:", error);
        empty.hidden = false;
        count.textContent = "0 photos";
      }
    }

    loadGallery();
  </script>
</body>
</html>
